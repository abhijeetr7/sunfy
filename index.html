<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groww Sunfy</title>
    <style>
:root {
  --ink: #1d2540;
  --paper: #fbfdff;
  --grid: #cfdae6;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  display: grid;
  place-items: center;
  background: #e9eff5;
  background-image: linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: "Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;
}

.card::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -13px;
  width: 96px;
  height: 26px;
  margin-left: -48px;
  background: #ffd95acc;
  transform: rotate(2deg);
  box-shadow: 0 1px 3px #0002;
}

#snd {
  position: absolute;
  right: 12px;
  top: 14px;
  border: 2px solid var(--ink);
  background: #fff;
  border-radius: 10px;
  font-size: 16px;
  padding: 3px 8px;
  cursor: pointer;
}

.hero {
  position: absolute;
  left: 12px;
  top: 10px;
  width: 48px;
  height: 48px;
  overflow: visible;
  cursor: pointer;
  z-index: 3;
  touch-action: manipulation;
}

.tick {
  fill: none;
  stroke: #fff;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  opacity: 0;
  transition: stroke-dashoffset .3s .1s,opacity .1s .1s;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
  background: #e4e9d8;
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

.stage {
  position: relative;
  width: min(78vw,60vh,300px);
  aspect-ratio: 300/400;
}

#b {
  position: absolute;
  left: 13.3%;
  right: 13.3%;
  top: 82.5%;
  bottom: 3%;
  padding: 0;
  border: 0;
  border-radius: 14px;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
  z-index: 2;
}

#b:focus-visible,
#snd:focus-visible {
  outline: 3px solid #e39a1c;
  outline-offset: 5px;
}

#b.busy {
  pointer-events: none;
}

svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

#btnG {
  transition: filter .2s,transform .12s;
}

#b:not(.busy):hover+svg #btnG {
  filter: brightness(1.08);
}

#b:not(.busy):active+svg #btnG {
  transform: translateY(3px);
}

#stem,
#stemO {
  stroke-dasharray: 1 2;
  stroke-dashoffset: 1.02;
}

#head,
#disc,
.pt {
  transform-origin: 150px 118px;
  transform: scale(0);
}

#head {
  opacity: 0;
}

.lf {
  transform: scale(0);
  opacity: 0;
}

#sway {
  transform-origin: 150px 340px;
}

#snd {
  position: fixed;
  right: 14px;
  top: 14px;
  border: 2px solid #3a2c1c44;
  background: transparent;
  border-radius: 10px;
  font-size: 16px;
  padding: 4px 9px;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="stage">
<button id="b" aria-label="Grow"></button>
<svg viewBox="0 0 300 400" aria-hidden="true">
<defs>
 <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#2f5a26" stroke-width="1.1"/></pattern>
 <linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="0" y1="340" x2="0" y2="125"><stop offset=".25" stop-color="#8a6a3e"/><stop offset=".65" stop-color="#6a9a4e"/></linearGradient>
</defs>
<g id="sway">
 <path id="stemO" pathLength="1" d="M150 345C146 285 156 205 150 125" fill="none" stroke="#3a2c1c" stroke-width="9.5"/>
 <path id="stem" pathLength="1" d="M150 345C146 285 156 205 150 125" fill="none" stroke="url(#sg)" stroke-width="6"/>
 <g id="leaves"></g>
 <g id="head"><circle cx="150" cy="118" r="34" fill="#6a9a4e" stroke="#3a2c1c" stroke-width="1.5"/><g id="petB"></g><g id="petF"></g><g id="disc"></g></g>
</g>
<g id="btnG">
 <rect x="40" y="330" width="220" height="50" rx="14" fill="#5c9a5a"/>
 <rect x="46" y="333" width="208" height="14" rx="7" fill="#fff" opacity=".14"/>
 <text x="150" y="364" text-anchor="middle" font-size="22" font-weight="600" letter-spacing=".5" fill="#fff">Grow</text>
</g>
</svg>
</div>
<button id="snd" aria-label="Toggle sound">🔊</button>

    <script>
/* ---------- sound (synthesized) ---------- */
/* ---------- drawing ---------- */
// leaves along the stem: x, y, angle, length, colour
// sunflower head
/* ---------- grow, flower, and fold back ---------- */

const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms)),R=(a,b)=>a+Math.random()*(b-a),NS='http://www.w3.org/2000/svg',INK='#3a2c1c';

let ctx,nb,sound=true;
const AC=()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx};
function tone(f1,f2,d,type='sine',v=.15,delay=0){if(!sound)return;const c=AC(),t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,f1,f2,v=.12,q=1){if(!sound)return;const c=AC(),t=c.currentTime;
 if(!nb){nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=c.createBufferSource(),b=c.createBiquadFilter(),g=c.createGain();s.buffer=nb;b.type='bandpass';b.Q.value=q;
 b.frequency.setValueAtTime(f1,t);b.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(b).connect(g).connect(c.destination);s.start(t,Math.random()*.5,d+.02)}
const sfx={
 press:()=>{tone(220,120,.09,'triangle',.12);noise(.05,1800,900,.05,2)},
 grow:()=>{noise(2.4,260,800,.035,.6);for(let i=0;i<10;i++)tone(380+i*55,430+i*55,.16,'sine',.045,i*.23)},
 leaf:()=>{tone(900,1500,.08,'sine',.05);noise(.05,3000,5000,.03,2)},
 pop:()=>{tone(250,950,.1,'sine',.25);noise(.05,2200,800,.12)},
 bloom:()=>{noise(.5,500,3000,.07,.5);[[523,0],[659,.09],[784,.18],[1047,.27]].forEach(([f,d])=>{tone(f,f,.5,'triangle',.07,d);tone(f*2,f*2,.35,'sine',.03,d)})},
 sink:()=>{tone(700,160,.3,'sine',.14);noise(.12,1600,600,.07)}
};
$('#snd').onclick=e=>{e.stopPropagation();sound=!sound;e.currentTarget.textContent=sound?'🔊':'🔇'};

const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.append(e);return e};
const btn=$('#b'),live=[];
const A=(e,kf,o)=>{const a=e.animate(kf,Object.assign({fill:'forwards'},o));live.push(a);return a};
const pop=(e,d,o={})=>A(e,[{transform:'scale(0) rotate(-25deg)',opacity:1},{transform:'scale(1.12) rotate(3deg)',opacity:1,offset:.7},{transform:'scale(1) rotate(0)',opacity:1}],Object.assign({duration:d,easing:'cubic-bezier(.3,.8,.4,1)'},o));

const L=[[149,312,200,44,'#6a9a4e'],[150,272,-20,44,'#86b05a'],[151,232,205,38,'#5b8c44'],[152,194,-25,32,'#6a9a4e']];
const leaves=L.map(([x,y,a,l,c])=>{const g=el('g',{transform:`translate(${x} ${y}) rotate(${a})`},$('#leaves')),i=el('g',{class:'lf'},g),w=l*.34,d=`M0 0C${l*.25} ${-w} ${l*.7} ${-w*1.1} ${l} 0C${l*.7} ${w*1.1} ${l*.25} ${w} 0 0Z`;
 i.style.transformOrigin='0px 0px';
 el('path',{d,fill:c,stroke:INK,'stroke-width':1.4,'stroke-linejoin':'round'},i);el('path',{d,fill:'url(#hatch)',opacity:.4},i);
 el('path',{d:`M0 0Q${l*.5} ${-w*.15} ${l*.92} 0`,fill:'none',stroke:INK,'stroke-width':1},i);return i});

const petB=[],petF=[];
for(let i=0;i<16;i++){const g=el('g',{transform:`rotate(${i*22.5} 150 118)`},$('#petB'));petB.push(el('ellipse',{class:'pt',cx:150,cy:73,rx:10.5,ry:21,fill:'#e8a21d',stroke:INK,'stroke-width':1.3},g))}
for(let i=0;i<16;i++){const g=el('g',{transform:`rotate(${i*22.5+11.25} 150 118)`},$('#petF'));petF.push(el('ellipse',{class:'pt',cx:150,cy:75,rx:9.5,ry:19,fill:'#f6c431',stroke:INK,'stroke-width':1.3},g));el('path',{d:'M150 90V58',stroke:'#c98614','stroke-width':.8,fill:'none'},g)}
const disc=$('#disc');el('circle',{cx:150,cy:118,r:26,fill:'#5b3a1e',stroke:INK,'stroke-width':1.5},disc);
for(let i=1;i<72;i++){const a=i*2.39996,r=2.9*Math.sqrt(i);el('circle',{cx:150+r*Math.cos(a),cy:118+r*Math.sin(a),r:1.5,fill:i%3?'#3b2412':'#8a5b2e'},disc)}

let busy=false,grown=false;
const FIN=.85;
async function grow(){
 const head=$('#head'),sway=$('#sway'),E='cubic-bezier(.5,0,.2,1)',D=2800;
 sfx.press();await wait(150);sfx.grow();
 ['#stemO','#stem'].forEach(s=>A($(s),[{strokeDashoffset:1.02},{strokeDashoffset:0}],{duration:D,easing:E}));
 [.14,.34,.54,.74].forEach((f,i)=>setTimeout(()=>{sfx.leaf();pop(leaves[i],650)},D*f));
 await wait(D-100);
 sfx.pop();A(head,[{transform:'scale(0)',opacity:1},{transform:'scale(.46)',opacity:1,offset:.7},{transform:'scale(.38)',opacity:1}],{duration:380});
 await wait(520);
 sfx.bloom();
 A(head,[{transform:'scale(.38)'},{transform:`scale(${FIN*1.08})`,offset:.7},{transform:`scale(${FIN})`}],{duration:900,easing:'cubic-bezier(.3,.9,.4,1)'});
 petB.forEach((p,i)=>pop(p,620,{delay:i*32}));petF.forEach((p,i)=>pop(p,620,{delay:140+i*32}));
 A($('#disc'),[{transform:'scale(0)'},{transform:'scale(1.12)',offset:.7},{transform:'scale(1)'}],{duration:520,delay:360});
 await wait(1300);
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)A(sway,[{transform:'rotate(-1.4deg)'},{transform:'rotate(1.4deg)'}],{duration:2000,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});
 grown=true;
}
async function fold(){
 sfx.sink();
 await A($('#head'),[{transform:`scale(${FIN})`},{transform:'scale(0)'}],{duration:420,easing:'ease-in'}).finished;
 leaves.slice().reverse().forEach((l,i)=>A(l,[{transform:'scale(1)'},{transform:'scale(0)'}],{duration:300,delay:i*70}));
 await wait(380);
 ['#stemO','#stem'].forEach(s=>A($(s),[{strokeDashoffset:0},{strokeDashoffset:1.02}],{duration:800,easing:'ease-in'}));
 await wait(850);
 live.splice(0).forEach(a=>a.cancel());grown=false;
}
btn.addEventListener('click',async()=>{
 if(busy)return;busy=true;btn.classList.add('busy');AC();
 try{grown?await fold():await grow()}finally{btn.classList.remove('busy');busy=false}
});
</script>
</body>
</html>
